<!DOCTYPE html>
{% if page.lang %}
  <html lang="{{ page.lang }}">
{% else %}
  <html lang="{{ site.default_lang }}">
{% endif %}
  <head>
    {% include head.html %}
    {% if extra_header %}
      {{ extra_header }}
    {% endif %}
  </head>
  <body>
    <div class="container-wrapper">
      <header class="container-header">
        {% include header.html %}
        {% include langswitch.html %}
      </header>
      <main class="container-main">
        {{ content }}
      </main>
      <footer class="container-footer">
        {% include footer.html %}
      </footer>
    </div>
  </body>
</html>
